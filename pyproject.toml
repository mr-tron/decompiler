[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvm-func-decompiler"
version = "0.1.0"
description = "Deterministic TVM/Fift to FunC reconstruction and compiler research"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
decompiler = "decompiler.cli:main"

[tool.setuptools]
packages = ["decompiler"]

[tool.setuptools.package-data]
decompiler = ["index.html"]
